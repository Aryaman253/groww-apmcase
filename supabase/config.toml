# Supabase CLI config. Used by the Supabase GitHub integration (working directory ".").
# Migrations in ./migrations are applied to the hosted project when merged to main.
project_id = "tarrow"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
# Seed/demo data lives in migrations and a server-side seed routine, not seed.sql.
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"
